<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FunChat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FunChat" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Icons Round -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      // If launching directly into incoming or accepted call, apply dark call theme & show Connecting to call...
      if (window.location.search.indexOf('callAction=') !== -1 || window.location.pathname.indexOf('/call') !== -1) {
        document.documentElement.style.backgroundColor = '#0f172a';
        if (document.body) document.body.style.backgroundColor = '#0f172a';
        var style = document.createElement('style');
        style.innerHTML = 'html, body, #root, .initial-splash { background-color: #0f172a !important; color: #ffffff !important; } .title { color: #f8fafc !important; } .subtitle { color: #94a3b8 !important; } .bubble-sub { background: #1e293b !important; border-color: #334155 !important; }';
        document.head.appendChild(style);
        document.addEventListener('DOMContentLoaded', function() {
          var t = document.querySelector('.title');
          var s = document.querySelector('.subtitle');
          if (t) t.textContent = 'Connecting to call...';
          if (s) s.textContent = 'Setting up secure audio & video channel';
        });
      }
    </script>
    <style>
      /* Clean Light Theme Loading Stage */
      html, body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: #ffffff !important;
      }
      .initial-splash {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        text-align: center;
      }
      .art-stage {
        position: relative;
        width: 180px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bubble-main {
        position: absolute;
        width: 96px;
        height: 72px;
        border-radius: 24px 24px 6px 24px;
        background: linear-gradient(135deg, #0088cc, #00a8ff);
        box-shadow: 0 14px 30px rgba(0, 136, 204, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        animation: floatMain 3.2s ease-in-out infinite;
        z-index: 2;
      }
      @keyframes floatMain {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffffff;
        animation: bounceDot 1.4s ease-in-out infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounceDot {
        0%, 80%, 100% { transform: scale(0.8); opacity: 0.6; }
        40% { transform: scale(1.2) translateY(-4px); opacity: 1; }
      }
      .bubble-sub {
        position: absolute;
        bottom: 10px;
        left: 12px;
        width: 58px;
        height: 44px;
        border-radius: 18px 18px 18px 4px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        animation: floatSub 2.8s ease-in-out infinite;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      @keyframes floatSub {
        0%, 100% { transform: translate(0) rotate(-4deg); }
        50% { transform: translateY(6px) rotate(2deg); }
      }
      .sub-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #94a3b8;
      }
      .ripple {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 1.5px dashed rgba(0, 136, 204, 0.2);
        animation: spinSlow 20s linear infinite;
      }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      .title {
        margin-top: 28px;
        font-size: 1.15rem;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.2px;
      }
      .subtitle {
        margin-top: 6px;
        font-size: 0.84rem;
        color: #64748b;
        font-weight: 400;
        animation: pulseText 2s ease-in-out infinite;
      }
      @keyframes pulseText {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body data-color-theme="default">
    <div id="root">
      <!-- Premium Animated Chat Bubbles Loader shown continuously until React mounts -->
      <div class="initial-splash">
        <div class="art-stage">
          <div class="ripple"></div>
          <div class="bubble-main">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="bubble-sub">
            <span class="sub-dot"></span>
            <span class="sub-dot"></span>
            <span class="sub-dot"></span>
          </div>
        </div>
        <div class="title">Starting FunChat</div>
        <div class="subtitle">Setting up your secure workspace...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
